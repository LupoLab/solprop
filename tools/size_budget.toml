# Ratchets for `poe size-check` (tools/size_report.py --check) on src/solprop. Each cap
# is today's figure or tighter: lower one when the code improves, never raise one to let
# a change through (docs/dev/tooling.md, "Size").

[private_docstrings]
# Private definitions (numpydoc's rule) whose docstring has numpydoc sections
# (Parameters, Returns, Yields, Raises, Examples, See Also). The target is 0 (AGENTS.md,
# "Docstrings and comments").
max_sectioned = 2848

[modules]
# No module grows past this many lines.
max_lines = 4000
# An allowed module's cap is its size plus a headroom of headroom_percent of it, at least
# headroom_lines, so that a small fix doesn't fail. The check fails when an entry exceeds
# its module's size by more than that headroom (or names a module that is gone or now
# under max_lines): a module that shrinks tightens its entry in the same change.
headroom_percent = 2
headroom_lines = 50

[modules.allow]
# The modules already larger. Remove an entry once its module is split below max_lines.
"src/solprop/driver/simulation.py" = 13376
"src/solprop/translate/problem.py" = 7049
"src/solprop/output/schema.py" = 5972
"src/solprop/tools.py" = 4286
"src/solprop/spatial.py" = 4112

[private_imports]
# Private names imported from another package: a private name, any name from a private
# module of a subpackage, or a private module itself (`from solprop import _process`).
# Public names from the root's private modules (`from solprop._process import ...`) are
# shared by design and do not count.
max_cross_package = 91
