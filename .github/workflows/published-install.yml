name: Published install

on:
  workflow_call:
    inputs:
      version:
        description: Published version to install (with or without a leading v)
        required: true
        type: string
      readme_example:
        description: Also run the release's full README example (manual qualification only)
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Published version to install (with or without a leading v)
        required: true
        type: string
      readme_example:
        description: Also run the release's full README example (manual qualification only)
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  install:
    name: published-install (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: linux-x86_64, os: ubuntu-24.04 }
          - { id: linux-aarch64, os: ubuntu-24.04-arm }
          - { id: macos-arm64, os: macos-15 }
          - { id: windows-amd64, os: windows-2025 }
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
      VERSION: ${{ inputs.version }}
      RUN_README: ${{ inputs.readme_example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the optional example comes from the release's tag
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv python install 3.14
      - name: Install from PyPI and check the selected backend
        working-directory: ${{ runner.temp }}
        run: |
          args=(--version "$VERSION" --directory "$RUNNER_TEMP/published-install")
          if [ "$RUN_README" = true ]; then
            args+=(--readme-example)
          fi
          uv run --no-project --no-config --python 3.14 python -I \
            "$GITHUB_WORKSPACE/.github/scripts/published_install.py" "${args[@]}"
      - name: Preserve the installation evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-install-${{ matrix.id }}
          path: ${{ runner.temp }}/published-install/evidence/
          if-no-files-found: warn
