name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # FFTW's measured planning is slow and machine-specific; CI plans by estimate.
  SOLPROP_FFTW_PLAN: estimate

jobs:
  # Which lanes to run. A change confined to docs/ and Markdown files runs the static
  # checks, the documentation build and the tests that read the documentation
  # (docs-tests), not the test lanes; anything else, or a push whose base is unknown,
  # runs everything. A push to main that merges a pull request runs nothing when the
  # pushed tree is the pull request head's tree and CI passed on that head: the pull
  # request was up to date with main, so its run already tested exactly this tree.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      lanes: ${{ steps.diff.outputs.lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          lanes=full
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE" HEAD > changed.txt
            cat changed.txt
            if ! grep -qvE '^docs/|\.md$' changed.txt; then lanes=docs; fi
          fi
          if [ "$EVENT" = push ]; then
            tree=$(git rev-parse "HEAD^{tree}")
            for head in $(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" --jq '.[].head.sha'); do
              git fetch -q --depth=1 origin "$head" || continue
              [ "$(git rev-parse "$head^{tree}")" = "$tree" ] || continue
              passed=$(gh api "repos/$REPO/actions/runs?head_sha=$head&status=success" \
                --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")] | length')
              if [ "$passed" -gt 0 ]; then
                echo "CI passed on pull request head $head, which has this tree"
                lanes=none
              fi
            done
          fi
          echo "lanes=$lanes" | tee -a "$GITHUB_OUTPUT"

  docs-tests:
    needs: changes
    if: needs.changes.outputs.lanes == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked
      # The test modules that open a documentation file (the SEP structure, the guide's
      # snippets, the accuracy page, the catalogues, the kernel contract, the figures).
      - name: The tests that read the documentation
        run: |
          uv run pytest -n 4 $(grep -lE '"docs"|"docs/|"(CHANGELOG|README|AGENTS)\.md"|\.md"\)|/ "[a-z0-9-]+\.md"' tests/test_*.py tests/*/test_*.py)

  # The definition-of-done gate of AGENTS.md (`poe check`), split into jobs that run in
  # parallel: the static checks, the documentation, the default test lane and the slow
  # lane. The default lane runs with coverage on Linux (the coverage job) and plainly on
  # macOS, so each platform runs it once.
  static:
    needs: changes
    if: needs.changes.outputs.lanes != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run poe types
      - run: uv run poe docstrings
      - run: uv run poe spell
      - run: uv run poe reuse

  docs:
    needs: changes
    if: needs.changes.outputs.lanes != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run poe docs

  test:
    needs: changes
    if: needs.changes.outputs.lanes == 'full'
    name: test (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run poe test

  slow:
    needs: changes
    if: needs.changes.outputs.lanes == 'full'
    name: slow (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked
      # The statistics channel's cost budget is a timing measurement: on Linux only,
      # where it runs alone on the runner; macOS's three shared cores make it noise.
      - if: runner.os == 'Linux'
        run: uv run poe test-slow
      - if: runner.os != 'Linux'
        run: uv run poe test-slow-functional

  # The default lane at 100 % of statements and branches (the lane's two passes), on
  # Linux with the native package built from this tree (solprop's native paths are part
  # of the 100 %), and its report (coverage.xml) for the badge.
  coverage:
    needs: changes
    if: needs.changes.outputs.lanes == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install the native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++-14 libfftw3-dev ninja-build pkg-config
      - run: uv python install 3.14
      - run: uv sync --locked --extra native
      # The default lane's peak memory on four test workers is at the edge of the
      # runner's 16 GB (the runner shut down mid-suite twice): swap turns a peak into a
      # slowdown, and three workers lower it.
      - name: Add swap
        run: |
          sudo fallocate -l 12G /swap.extra
          sudo chmod 600 /swap.extra
          sudo mkswap /swap.extra
          sudo swapon /swap.extra
          free -h
      - run: uv run poe cov
        env:
          PYTEST_XDIST_AUTO_NUM_WORKERS: "3"
      - if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The default lane on Windows: numpy_ref and numba_cpu (the native package's Windows build
  # is not yet in CI). The lint, type, docstring, spelling, REUSE and docs steps are
  # platform-independent and run in the static and docs jobs.
  windows:
    needs: changes
    if: needs.changes.outputs.lanes == 'full'
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run poe test

  # The floors in pyproject.toml are claims: test them. solprop with the lowest versions
  # of its direct dependencies that the floors allow, and the test tools at their latest.
  oldest:
    needs: changes
    if: needs.changes.outputs.lanes == 'full'
    name: tests (lowest dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SOLPROP_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv venv --python 3.14
      - run: uv pip install --resolution lowest-direct -e .
      - run: >-
          uv pip install pytest pytest-xdist pytest-randomly pytest-regressions
          pytest-cov hypothesis beartype sympy psutil
      - run: uv pip list
      - run: .venv/bin/python -m pytest -n auto --dist loadgroup

  # The native package's gate (native/scripts/check.sh): its format, lint and strict
  # typing, clang-format, clang-tidy, the native tests, the ASan+UBSan native tests,
  # pytest on an editable build, and the distribution wheel's build and isolated smoke
  # test.
  native-quality:
    needs: changes
    if: needs.changes.outputs.lanes == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CXX: g++-14
      OMP_NUM_THREADS: "4"
      OMP_PROC_BIND: spread
      OMP_PLACES: cores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history: the version of both distributions comes from the tags.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Install the native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-tidy cmake g++-14 libfftw3-dev ninja-build pkg-config
      - run: uv python install 3.14
      - run: uv run --locked poe check-native

  # The default lane with the native CPU backend, from this tree's distribution wheel.
  # Every other job runs without it, so backend="auto" selects numba_cpu there, and
  # numpy_ref is checked by the parity tests in every job.
  native-suite:
    needs: changes
    if: needs.changes.outputs.lanes == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CXX: g++-14
      # The driver tests select their backend from this variable, not from "auto".
      SOLPROP_TEST_BACKEND: native
      # Three test workers (with swap below): four exhausted the runner's memory at 87 %
      # of the suite, and two did not finish in two hours.
      PYTEST_XDIST_AUTO_NUM_WORKERS: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install the native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++-14 libfftw3-dev ninja-build pkg-config
      - run: uv python install 3.14
      - run: uv sync --locked
      - name: Build the native CPU distribution wheel
        working-directory: native
        run: >-
          uv build --python 3.14 --wheel
          -Ccmake.define.SOLPROP_NATIVE_PROFILE=DISTRIBUTION --out-dir ../wheelhouse
      - name: Install the wheel into the environment
        run: |
          uv pip install --python .venv/bin/python --no-deps wheelhouse/*.whl
          uv run --no-sync python -c "from solprop.backends.registry import resolve_name; assert resolve_name() == 'native', resolve_name()"
      # The default lane's peak memory on four test workers is at the edge of the
      # runner's 16 GB (the runner shut down mid-suite twice): swap turns a peak into a
      # slowdown, and three workers lower it.
      - name: Add swap
        run: |
          sudo fallocate -l 12G /swap.extra
          sudo chmod 600 /swap.extra
          sudo mkswap /swap.extra
          sudo swapon /swap.extra
          free -h
      - run: uv run --no-sync poe test
