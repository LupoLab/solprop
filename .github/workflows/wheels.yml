# Spike only, never merged: why np.linalg.solve crashes on Windows on Arm.
name: Wheels

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: windows-11-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PYTEST_XDIST_AUTO_NUM_WORKERS: "1"
      SOLPROP_TEST_TYPECHECK: "0"
      SOLPROP_FFTW_PLAN: estimate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-wheel-windows-arm64
          path: wheelhouse
          run-id: 41430660840
          github-token: ${{ github.token }}
      - run: uv python install 3.14
      - run: uv sync --locked
      - name: NumPy alone, no native installed
        continue-on-error: true
        run: |
          set +e
          uv run --no-sync python .github/scripts/arm_probe.py numpy-config; echo "exit $?"
          OPENBLAS_NUM_THREADS=1 uv run --no-sync python .github/scripts/arm_probe.py numpy-1t; echo "exit $?"
      - name: The crashing test, no native installed
        continue-on-error: true
        run: |
          set +e
          SOLPROP_TEST_BACKEND=numpy_ref OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 uv run --no-sync python -X faulthandler -m pytest -p no:xdist -o addopts="" -q -x tests/backends/test_radial_absorber.py 2>&1 | tail -30; echo "exit ${PIPESTATUS[0]}"
      - run: uv pip install --no-deps wheelhouse/*.whl
      - name: NumPy with native imported first
        continue-on-error: true
        run: |
          set +e
          uv run --no-sync python .github/scripts/arm_probe.py native-numpy; echo "exit $?"
          OPENBLAS_NUM_THREADS=1 uv run --no-sync python .github/scripts/arm_probe.py native-numpy-1t; echo "exit $?"
      - name: The crashing test, native installed
        continue-on-error: true
        run: |
          set +e
          SOLPROP_TEST_BACKEND=native OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 uv run --no-sync python -X faulthandler -m pytest -p no:xdist -o addopts="" -q -x tests/backends/test_radial_absorber.py 2>&1 | tail -30; echo "exit ${PIPESTATUS[0]}"
      - name: The same call, as the test makes it
        continue-on-error: true
        run: |
          set +e
          OPENBLAS_NUM_THREADS=1 uv run --no-sync python -X faulthandler - <<'P'; echo "exit $?"
          import numpy as np
          from solprop.grid import RadialGrid
          for n in (8, 16, 32, 64, 128):
              space = RadialGrid(6e-4, n)
              hankel = space.hankel
              diagonal = hankel.j1[:, None] / hankel.j1[None, :]
              forward = hankel.forward_scale * diagonal * hankel.matrix
              inverse = hankel.inverse_scale * diagonal * hankel.matrix
              k_r = np.asarray(space.k_r); k = 8e6
              phase = np.sqrt(k * k - k_r * k_r + 0j) - k
              rate = np.linspace(0, 1e3, forward.shape[0])
              generator = np.diag(1j * phase) + forward @ np.diag(-0.5 * rate) @ inverse
              values, vectors = np.linalg.eig(generator)
              print(n, vectors.shape, vectors.dtype, vectors.flags.c_contiguous, float(abs(vectors).max()), np.isfinite(vectors).all(), flush=True)
              start = np.linalg.solve(vectors, np.ones(forward.shape[0]) + 0j)
              print(" solved", np.isfinite(start).all(), flush=True)
          P
