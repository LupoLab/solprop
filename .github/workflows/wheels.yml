# Spike only, never merged: which LAPACK calls crash on Windows on Arm, and under what.
name: Wheels

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: windows-11-arm
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      SOLPROP_TEST_TYPECHECK: "0"
      SOLPROP_FFTW_PLAN: estimate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv python install 3.14
      - run: uv sync --locked
      - name: Wider widths, as on a machine with more cores
        continue-on-error: true
        timeout-minutes: 20
        run: .venv/Scripts/python.exe .github/scripts/arm_table.py .venv/Scripts/python.exe widths
      - name: Real runs on the reference backend
        continue-on-error: true
        timeout-minutes: 40
        run: .venv/Scripts/python.exe .github/scripts/arm_runs.py .venv/Scripts/python.exe numpy_ref
      - name: Install the native wheel from PR 395's run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41438647807 -R ${{ github.repository }} -n wheel-windows-arm64 -D armwheel
          ls armwheel
          VIRTUAL_ENV=.venv uv pip install --no-deps armwheel/*.whl
      - name: Real runs on native
        timeout-minutes: 40
        run: .venv/Scripts/python.exe .github/scripts/arm_runs.py .venv/Scripts/python.exe native
