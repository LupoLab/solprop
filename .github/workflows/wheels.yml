# Spike only, never merged: which LAPACK calls crash on Windows on Arm, and under what.
name: Wheels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-11-arm
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      SOLPROP_TEST_TYPECHECK: "0"
      SOLPROP_FFTW_PLAN: estimate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv python install 3.14
      - run: uv sync --locked
      - name: Which sizes crash at one thread
        timeout-minutes: 10
        run: .venv/Scripts/python.exe .github/scripts/arm_table.py .venv/Scripts/python.exe fine
      - name: A run with no thread settings, on the reference backend
        timeout-minutes: 15
        run: |
          set +e
          for n in 16 32 64; do
            .venv/Scripts/python.exe .github/scripts/arm_real.py $n 2>&1 | tail -14 | cut -c1-110
            echo "real n_r=$n exit ${PIPESTATUS[0]}"
          done
      - name: The same run at one thread by environment
        timeout-minutes: 15
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          set +e
          for n in 16 32 64; do
            .venv/Scripts/python.exe .github/scripts/arm_real.py $n 2>&1 | tail -14 | cut -c1-110
            echo "real-env1 n_r=$n exit ${PIPESTATUS[0]}"
          done
      - name: Other NumPy releases
        timeout-minutes: 8
        run: |
          set +e
          uv venv --python 3.14 other
          for v in 2.4.4 2.5.0; do
            VIRTUAL_ENV=other uv pip install -q "numpy==$v"
            .venv/Scripts/python.exe .github/scripts/arm_table.py other/Scripts/python.exe $v
          done
      - name: Other widths, with a time limit on each process
        timeout-minutes: 25
        run: .venv/Scripts/python.exe .github/scripts/arm_table.py .venv/Scripts/python.exe widths
