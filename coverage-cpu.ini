# Coverage configuration of the CPU lanes (`poe cov`): every line of solprop, which the
# lane requires to 100 %.
[run]
source = solprop
branch = True
# SEP 48: the optional Tier 3 Julia adapter has its own runtime/device lane;
# every other solprop module retains the required 100% statement/branch gate.
omit = */solprop/backends/julia/*

[report]
fail_under = 100
show_missing = True
exclude_also =
    if TYPE_CHECKING:
    @overload
    raise NotImplementedError
    ^\s*\.\.\.$
