# Coverage configuration of the CPU lanes (`poe cov`): every line of solprop but the
# `mlx` backend (SEP 33), which imports MLX, installable on macOS on Apple silicon
# only: the lane runs on Linux. Its tests run in the macOS default lane, on MLX's CPU
# device where the runner has no Metal GPU, and on the Metal device locally. The lane
# requires 100 % of what it measures.
[run]
source = solprop
branch = True
omit =
    */solprop/backends/mlx_gpu/*

[report]
fail_under = 100
show_missing = True
exclude_also =
    if TYPE_CHECKING:
    @overload
    raise NotImplementedError
    ^\s*\.\.\.$
