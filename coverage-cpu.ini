# Coverage configuration of the CPU lanes (`poe cov`): every line of solprop, which the
# lane requires to 100 %.
[run]
source = solprop
branch = True

[report]
fail_under = 100
show_missing = True
exclude_also =
    if TYPE_CHECKING:
    @overload
    raise NotImplementedError
    ^\s*\.\.\.$
