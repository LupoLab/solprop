<rect x="0" y="0" width="560" height="500" class="ground" />
<text x="20.0" y="26.0" font-size="15" class="bold">Antiresonant tube lattice</text>
<text x="20.0" y="44.0" font-size="11" class="dim">Six tubes of 9 µm outer radius around a 15 µm core, to scale (the 180 nm walls are</text>
<text x="20.0" y="58.0" font-size="11" class="dim">drawn thicker). The propagated field is Marcatili's HE₁₁ in the core alone.</text>
