<text x="20.0" y="26.0" font-size="15" class="bold">The capillary wall, two ways</text>
<text x="20.0" y="44.0" font-size="11" class="dim">One HE₁₁, HE₁₂, HE₁₃ basis on one radial rule. Left: each channel attenuates on its own.</text>
<text x="20.0" y="58.0" font-size="11" class="dim">Right: the outgoing boundary condition, condensed onto the basis, couples every pair.</text>
