<text x="360.0" y="246.0" font-size="12.5" class="">x = ±a: E normal to the wall</text>
<text x="360.0" y="260.0" font-size="11" class="dim">TM-like: a_c = ε_cl / (ε_co s)</text>
<circle cx="205.68" cy="142.0" r="2.2" class="node-dim" />
<path d="M205.68,142.0 L355.0,88.0" class="leader" />
<text x="360.0" y="92.0" font-size="12.5" class="">y = ±b: E parallel to the wall</text>
<text x="360.0" y="106.0" font-size="11" class="dim">TE-like: b_c = 1/s, s = √(ε_cl − ε_co)</text>
<text x="360.0" y="150.0" font-size="12.5" class="">E zero outside the rectangle;</text>
<text x="360.0" y="164.0" font-size="11" class="dim">each wall pair adds its complex κ²</text>
<text x="360.0" y="178.0" font-size="11" class="dim">to β² (Laakmann–Steier)</text>
<text x="360.0" y="192.0" font-size="11" class="dim">the y partner swaps a_c and b_c:</text>
<text x="360.0" y="206.0" font-size="11" class="dim">not degenerate, its own row</text>
