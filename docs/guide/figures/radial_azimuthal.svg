<text x="78.0" y="226.0" font-size="11" class="dim mid">r = 0</text>
<text x="520.0" y="226.0" font-size="11" class="dim mid">R</text>
<text x="20.0" y="258.0" font-size="12.5" class="">the full expansion: one transform per order, and an interpolation or a</text>
<text x="20.0" y="272.0" font-size="11" class="dim">non-orthogonal transform between them at every stage</text>
<text x="20.0" y="292.0" font-size="12.5" class="">one order alone: exact for radially or azimuthally polarised beams;</text>
<text x="20.0" y="306.0" font-size="11" class="dim">for a scalar vortex only as an envelope without THG (a real field's</text>
<text x="20.0" y="320.0" font-size="11" class="dim">third harmonic carries 3m). Use x–y free space for azimuthal structure.</text>
