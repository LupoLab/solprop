</defs>
<style>
svg {
    --ground: #fbfbfd;
    --ink: #1b1f24;
    --dim: #5b6673;
    --rule: #c9d0da;
    --gas-fill: #e9f1fb;
    --gas-edge: #2f5eb0;
    --glass-fill: #d5e9dc;
    --glass-edge: #2c7a55;
    --metal-fill: #e4e0d6;
    --metal-edge: #7a6848;
    --core-fill: #cfe0f4;
    --core-edge: #2f5eb0;
    --collar-fill: #f8e8d2;
    --collar-edge: #a96a15;
    --curve-a: #b8334f;
    --curve-b: #6f45a6;
    --curve-c: #a96a15;
    --pol: #b8334f;
}
@media (prefers-color-scheme: dark) {
  svg {
    --ground: #171a1f;
    --ink: #e7eaef;
    --dim: #9aa5b3;
    --rule: #3a424e;
    --gas-fill: #18222f;
    --gas-edge: #7ba6e8;
    --glass-fill: #173528;
    --glass-edge: #5cb98a;
    --metal-fill: #35302a;
    --metal-edge: #c9b48c;
    --core-fill: #1d3150;
    --core-edge: #7ba6e8;
    --collar-fill: #3a2b15;
    --collar-edge: #e0a44f;
    --curve-a: #ee8ca0;
    --curve-b: #b99ae6;
    --curve-c: #e0a44f;
    --pol: #ee8ca0;
  }
}
.ground { fill: var(--ground); stroke: none; }
.card { fill: var(--ground); stroke: var(--rule); stroke-width: 1.4; }
.outline { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.boundary { fill: none; stroke: var(--curve-a); stroke-width: 1.4;
  stroke-dasharray: 5 3; }
.guide { fill: none; stroke: var(--dim); stroke-width: 1.4;
  stroke-dasharray: 2 3; }
.ring { fill: none; stroke: var(--rule); stroke-width: 1.4; }
.leader { fill: none; stroke: var(--dim); stroke-width: 1.4; }
.axis { fill: none; stroke: var(--dim); stroke-width: 1.4; }
.head { fill: var(--dim); stroke: none; }
.node { fill: var(--ink); stroke: none; }
.node-dim { fill: var(--dim); stroke: none; }
.pol { fill: none; stroke: var(--pol); stroke-width: 2.8;
  stroke-linecap: round; }
.pol-head { fill: var(--pol); stroke: none; }
text { font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; fill: var(--ink); white-space: pre; }
.dim { fill: var(--dim); }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.bold { font-weight: 600; }
.ink-pol { fill: var(--pol); }
.gas { fill: var(--gas-fill); stroke: var(--gas-edge); stroke-width: 1.4; }
.glass { fill: var(--glass-fill); stroke: var(--glass-edge); stroke-width: 1.4; }
.metal { fill: var(--metal-fill); stroke: var(--metal-edge); stroke-width: 1.4; }
.core { fill: var(--core-fill); stroke: var(--core-edge); stroke-width: 1.4; }
.collar { fill: var(--collar-fill); stroke: var(--collar-edge); stroke-width: 1.4; }
.curve-a { fill: none; stroke: var(--curve-a); stroke-width: 2.8; stroke-linejoin: round; stroke-linecap: round; }
.ink-curve-a { fill: var(--curve-a); }
.dot-curve-a { fill: var(--curve-a); stroke: none; }
.curve-b { fill: none; stroke: var(--curve-b); stroke-width: 2.8; stroke-linejoin: round; stroke-linecap: round; }
.ink-curve-b { fill: var(--curve-b); }
.dot-curve-b { fill: var(--curve-b); stroke: none; }
.curve-c { fill: none; stroke: var(--curve-c); stroke-width: 2.8; stroke-linejoin: round; stroke-linecap: round; }
.ink-curve-c { fill: var(--curve-c); }
.dot-curve-c { fill: var(--curve-c); stroke: none; }
</style>
