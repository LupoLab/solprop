<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="title desc">
<title id="title">From Maxwell's equations to solprop's propagation routes</title>
<desc id="desc">A flow chart. Maxwell's equations with a linear permittivity and a nonlinear polarisation and current lead to the frequency-domain wave equation, which splits exactly into a forward and a backward first-order equation. The one approximation, evaluating the polarisation from the forward field, gives the UPPE. The UPPE branches by transverse representation into free space with the exact longitudinal wavenumber, a set of guided modes projected on a quadrature, and a single frozen mode with an effective area, which is the GNLSE.</desc>
<style>
:root { --ink: #1f2328; --muted: #57606a; --box: #f6f8fa; --edge: #8c959f; --accent: #0072b2; --warm: #d55e00; }
@media (prefers-color-scheme: dark) { :root { --ink: #e6edf3; --muted: #9da7b1; --box: #161b22; --edge: #6e7681; --accent: #56b4e9; --warm: #f0a35e; } }
text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.h { font-size: 13px; font-weight: 600; }
.t { font-size: 11.5px; }
.s { font-size: 10.5px; fill: var(--muted); }
.box { fill: var(--box); stroke: var(--edge); stroke-width: 1.2; }
.key { fill: var(--box); stroke: var(--accent); stroke-width: 2; }
.line { stroke: var(--edge); stroke-width: 1.4; fill: none; }
.approx { stroke: var(--warm); stroke-width: 1.8; fill: none; stroke-dasharray: 5 3; }
.head { fill: var(--edge); }
.wtext { fill: var(--warm); font-size: 10.5px; }
</style>
<rect class="box" x="10" y="20" width="200" height="62" rx="8"/>
<text class="h" x="22" y="42">Maxwell's equations</text>
<text class="t" x="22" y="60">D = ε₀ ε∗E + P,  J free current</text>
<text class="s" x="22" y="75">Chapter 1</text>
<path class="line" d="M210 51 H262"/><path class="head" d="M262 46 L272 51 L262 56 Z"/>
<rect class="box" x="272" y="20" width="200" height="62" rx="8"/>
<text class="h" x="284" y="42">Wave equation in ω</text>
<text class="t" x="284" y="60">∂z²Ẽ + kz²Ẽ = −μ₀ω²P̃ − iμ₀ωJ̃</text>
<text class="s" x="284" y="75">exact apart from the scalar reduction</text>
<path class="line" d="M472 51 H524"/><path class="head" d="M524 46 L534 51 L524 56 Z"/>
<rect class="box" x="534" y="20" width="216" height="62" rx="8"/>
<text class="h" x="546" y="42">Forward and backward pair</text>
<text class="t" x="546" y="60">∂zẼ± = ±ikzẼ± ± iμ₀ω²P̃[Ẽ₊+Ẽ₋]/2kz</text>
<text class="s" x="546" y="75">exact; Chapter 2</text>
<path class="approx" d="M642 82 V128"/><path d="M637 128 L642 138 L647 128 Z" fill="var(--warm)"/>
<text class="wtext" x="634" y="112" text-anchor="end">the one approximation:</text>
<text class="wtext" x="634" y="126" text-anchor="end">P̃[Ẽ₊+Ẽ₋] → P̃[Ẽ₊]</text>
<rect class="key" x="452" y="138" width="298" height="62" rx="8"/>
<text class="h" x="464" y="160">UPPE (Kolesik and Moloney 2004)</text>
<text class="t" x="464" y="178">∂zẼ = ikzẼ + iω²P̃/(2ε₀c²kz) − ωJ̃/(2ε₀c²kz)</text>
<text class="s" x="464" y="193">moving frame, exact Φ, field or envelope</text>
<path class="line" d="M452 169 H380 V230"/>
<path class="line" d="M380 230 H110 V250"/><path class="head" d="M105 250 L110 260 L115 250 Z"/>
<path class="line" d="M380 230 V250"/><path class="head" d="M375 250 L380 260 L385 250 Z"/>
<path class="line" d="M380 230 H640 V250"/><path class="head" d="M635 250 L640 260 L645 250 Z"/>
<text class="s" x="390" y="222">transverse representation</text>
<rect class="box" x="10" y="260" width="200" height="60" rx="8"/>
<text class="h" x="22" y="281">Free space</text>
<text class="t" x="22" y="298">exact kz; Hankel, Cartesian, line</text>
<text class="s" x="22" y="312">Chapter 6</text>
<rect class="box" x="272" y="260" width="216" height="60" rx="8"/>
<text class="h" x="284" y="281">Guided modes</text>
<text class="t" x="284" y="298">βₘ(ω); synthesise, evaluate, project</text>
<text class="s" x="284" y="312">Chapters 4 and 5</text>
<rect class="box" x="534" y="260" width="216" height="60" rx="8"/>
<text class="h" x="546" y="281">One frozen mode: the GNLSE</text>
<text class="t" x="546" y="298">A_eff, γ = n₂ω₀/(cA_eff), shock = ω/ω₀</text>
<text class="s" x="546" y="312">Chapter 3</text>
</svg>
