<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="612.0" viewBox="0 0 1200 612.0">
<defs>
</defs>
<style>
svg {
    --ground: #fbfbfd;
    --ink: #1b1f24;
    --dim: #5b6673;
    --rule: #c9d0da;
    --p-fill: #e2f0e8;
    --p-edge: #2c7a55;
    --t-fill: #fceedd;
    --t-edge: #a96a15;
    --b-fill: #e3ebfa;
    --b-edge: #2f5eb0;
    --d-fill: #eee6f8;
    --d-edge: #6f45a6;
    --x-fill: #fce7ec;
    --x-edge: #af3450;
}
@media (prefers-color-scheme: dark) {
  svg {
    --ground: #171a1f;
    --ink: #e7eaef;
    --dim: #9aa5b3;
    --rule: #3a424e;
    --p-fill: #16342a;
    --p-edge: #5cb98a;
    --t-fill: #3a2b15;
    --t-edge: #e0a44f;
    --b-fill: #17253f;
    --b-edge: #7ba6e8;
    --d-fill: #2a1f3e;
    --d-edge: #b18fe0;
    --x-fill: #3a1e26;
    --x-edge: #e8879a;
  }
}
.ground { fill: var(--ground); stroke: none; }
.card { fill: var(--ground); stroke: var(--rule); stroke-width: 1.4; }
.plain { fill: none; stroke: var(--rule); stroke-width: 1.4; }
.planned { fill: none; stroke: var(--dim); stroke-width: 1.4;
  stroke-dasharray: 5 4; }
.arrow { fill: none; stroke: var(--dim); stroke-width: 1.4;
  stroke-linecap: round; stroke-linejoin: round; }
.head { fill: var(--dim); stroke: none; }
.rule { fill: none; stroke: var(--rule); stroke-width: 1.4; }
text { font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; fill: var(--ink);
  white-space: pre; }
.dim { fill: var(--dim); }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.bold { font-weight: 600; }
.fill-p { fill: var(--p-fill); stroke: var(--p-edge); }
.edge-p { stroke: var(--p-edge); }
.ink-p { fill: var(--p-edge); }
.fill-t { fill: var(--t-fill); stroke: var(--t-edge); }
.edge-t { stroke: var(--t-edge); }
.ink-t { fill: var(--t-edge); }
.fill-b { fill: var(--b-fill); stroke: var(--b-edge); }
.edge-b { stroke: var(--b-edge); }
.ink-b { fill: var(--b-edge); }
.fill-d { fill: var(--d-fill); stroke: var(--d-edge); }
.edge-d { stroke: var(--d-edge); }
.ink-d { fill: var(--d-edge); }
.fill-x { fill: var(--x-fill); stroke: var(--x-edge); }
.edge-x { stroke: var(--x-edge); }
.ink-x { fill: var(--x-edge); }
</style>
<rect x="0" y="0" width="1200" height="612.0" class="ground" />
<text x="32" y="44.0" font-size="21" class="bold">The data flow of one run</text>
<text x="32" y="64.0" font-size="12" class="dim">architecture.md §5, stage for stage. The spine is the call sequence; the column on the right is what each stage hands on, in the colour of the layer that owns it.</text>
<text x="32" y="93.5" font-size="12" class="bold dim">the calls</text>
<text x="782.0" y="93.5" font-size="12" class="bold dim">what crosses</text>
<rect x="32" y="105.5" width="560.0" height="66.0" rx="7" ry="7" class="fill-d" />
<text x="42.0" y="127.5" font-size="15" class="bold ink-d">prop_capillary(...) / prop_gnlse(...)</text>
<text x="42.0" y="143.0" font-size="12" class="dim">builds the physics objects: Grid, Modes, ZProfiles,</text>
<text x="42.0" y="158.5" font-size="12" class="dim">Responses, Pulses, Noise, Boundaries, StepperSettings, Output</text>
<rect x="782.0" y="105.5" width="386.0" height="50.5" rx="7" ry="7" class="fill-p" />
<text x="792.0" y="127.5" font-size="15" class="bold ink-p">Grid · Modes · ZProfiles · Responses</text>
<text x="792.0" y="143.0" font-size="12" class="dim">Pulses · Noise · Boundaries · StepperSettings · Output</text>
<path d="M598.0,138.5 L776.0,138.5" class="arrow" />
<path d="M776.0,138.5 L767.0,142.1 L767.0,134.9 Z" class="head" />
<text x="687.0" y="154.5" font-size="12" class="mid dim">a user script does the</text>
<text x="687.0" y="170.0" font-size="12" class="mid dim">same by hand</text>
<path d="M312.0,177.5 L312.0,205.5" class="arrow" />
<path d="M312.0,205.5 L308.4,196.5 L315.6,196.5 Z" class="head" />
<rect x="32" y="211.5" width="560.0" height="66.0" rx="7" ry="7" class="fill-d" />
<text x="42.0" y="233.5" font-size="15" class="bold ink-d">Simulation(...)</text>
<text x="42.0" y="249.0" font-size="12" class="dim">translate.assemble(...)  →  KernelProblem</text>
<text x="42.0" y="264.5" font-size="12" class="dim">backends.select(name, problem, grid=, modes=, profiles=)</text>
<rect x="782.0" y="211.5" width="386.0" height="50.5" rx="7" ry="7" class="fill-t" />
<text x="792.0" y="233.5" font-size="15" class="bold ink-t">KernelProblem</text>
<text x="792.0" y="249.0" font-size="12" class="dim">plain arrays, frozen, validated, schema_version 39</text>
<path d="M598.0,244.5 L776.0,244.5" class="arrow" />
<path d="M776.0,244.5 L767.0,248.1 L767.0,240.9 Z" class="head" />
<text x="687.0" y="260.5" font-size="12" class="mid dim">validated arrays,</text>
<text x="687.0" y="276.0" font-size="12" class="mid dim">schema_version</text>
<path d="M312.0,283.5 L312.0,311.5" class="arrow" />
<path d="M312.0,311.5 L308.4,302.5 L315.6,302.5 Z" class="head" />
<rect x="32" y="317.5" width="560.0" height="66.0" rx="7" ry="7" class="fill-b" />
<text x="42.0" y="339.5" font-size="15" class="bold ink-b">StepDriver.propagate_to(z_save)</text>
<text x="42.0" y="355.0" font-size="12" class="dim">the march, the replay, the landing, the controller,</text>
<text x="42.0" y="370.5" font-size="12" class="dim">the history, the noise, the per-stage bundle</text>
<rect x="782.0" y="317.5" width="386.0" height="50.5" rx="7" ry="7" class="fill-b" />
<text x="792.0" y="339.5" font-size="15" class="bold ink-b">StepSummary</text>
<text x="792.0" y="355.0" font-size="12" class="dim">z, n_steps, n_rejected, max_norm, mean_norm, wall_time</text>
<path d="M598.0,350.5 L776.0,350.5" class="arrow" />
<path d="M776.0,350.5 L767.0,354.1 L767.0,346.9 Z" class="head" />
<text x="687.0" y="366.5" font-size="12" class="mid dim">shared Python step loop</text>
<path d="M312.0,389.5 L312.0,417.5" class="arrow" />
<path d="M312.0,417.5 L308.4,408.5 L315.6,408.5 Z" class="head" />
<rect x="32" y="423.5" width="560.0" height="66.0" rx="7" ry="7" class="fill-d" />
<text x="42.0" y="445.5" font-size="15" class="bold ink-d">run loop over save planes</text>
<text x="42.0" y="461.0" font-size="12" class="dim">obs = backend.observe()        stats = backend.stats(spec)</text>
<text x="42.0" y="476.5" font-size="12" class="dim">output.save(SavedPlane(z, field, stats, step_history, step_stats))</text>
<rect x="782.0" y="423.5" width="386.0" height="66.0" rx="7" ry="7" class="fill-b" />
<text x="792.0" y="445.5" font-size="15" class="bold ink-b">Observation  →  SavedPlane</text>
<text x="792.0" y="461.0" font-size="12" class="dim">z, field, noise_phase, step_history, step_stats;</text>
<text x="792.0" y="476.5" font-size="12" class="dim">stats: a dict of small host arrays, keyed by name</text>
<path d="M598.0,456.5 L776.0,456.5" class="arrow" />
<path d="M776.0,456.5 L767.0,460.1 L767.0,452.9 Z" class="head" />
<text x="687.0" y="472.5" font-size="12" class="mid dim">small host arrays, one</text>
<text x="687.0" y="488.0" font-size="12" class="mid dim">fused pass</text>
<path d="M312.0,495.5 L312.0,523.5" class="arrow" />
<path d="M312.0,523.5 L308.4,514.5 L315.6,514.5 Z" class="head" />
<rect x="32" y="529.5" width="560.0" height="50.5" rx="7" ry="7" class="fill-x" />
<text x="42.0" y="551.5" font-size="15" class="bold ink-x">MemoryOutput / HDF5Output  →  processing / plotting</text>
<text x="42.0" y="567.0" font-size="12" class="dim">energy, fwhm, bandpass, g12  →  prop_2d, spec_1d, spectrograms</text>
<rect x="782.0" y="529.5" width="386.0" height="50.5" rx="7" ry="7" class="fill-d" />
<text x="792.0" y="551.5" font-size="15" class="bold ink-d">MemoryOutput / HDF5Output</text>
<text x="792.0" y="567.0" font-size="12" class="dim">one save protocol, one metadata schema</text>
<path d="M598.0,554.75 L776.0,554.75" class="arrow" />
<path d="M776.0,554.75 L767.0,558.35 L767.0,551.15 Z" class="head" />
<text x="687.0" y="570.75" font-size="12" class="mid dim">device arrays never cross</text>
<text x="687.0" y="586.25" font-size="12" class="mid dim">the seam</text>
</svg>