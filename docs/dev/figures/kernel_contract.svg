<style>
svg {
    --ground: #fbfbfd;
    --ink: #1b1f24;
    --dim: #5b6673;
    --rule: #c9d0da;
    --p-fill: #e2f0e8;
    --p-edge: #2c7a55;
    --t-fill: #fceedd;
    --t-edge: #a96a15;
    --b-fill: #e3ebfa;
    --b-edge: #2f5eb0;
    --d-fill: #eee6f8;
    --d-edge: #6f45a6;
    --x-fill: #fce7ec;
    --x-edge: #af3450;
}
@media (prefers-color-scheme: dark) {
  svg {
    --ground: #171a1f;
    --ink: #e7eaef;
    --dim: #9aa5b3;
    --rule: #3a424e;
    --p-fill: #16342a;
    --p-edge: #5cb98a;
    --t-fill: #3a2b15;
    --t-edge: #e0a44f;
    --b-fill: #17253f;
    --b-edge: #7ba6e8;
    --d-fill: #2a1f3e;
    --d-edge: #b18fe0;
    --x-fill: #3a1e26;
    --x-edge: #e8879a;
  }
}
.ground { fill: var(--ground); stroke: none; }
.card { fill: var(--ground); stroke: var(--rule); stroke-width: 1.4; }
.plain { fill: none; stroke: var(--rule); stroke-width: 1.4; }
.planned { fill: none; stroke: var(--dim); stroke-width: 1.4;
  stroke-dasharray: 5 4; }
.arrow { fill: none; stroke: var(--dim); stroke-width: 1.4;
  stroke-linecap: round; stroke-linejoin: round; }
.head { fill: var(--dim); stroke: none; }
.rule { fill: none; stroke: var(--rule); stroke-width: 1.4; }
text { font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; fill: var(--ink);
  white-space: pre; }
.dim { fill: var(--dim); }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.bold { font-weight: 600; }
.fill-p { fill: var(--p-fill); stroke: var(--p-edge); }
.edge-p { stroke: var(--p-edge); }
.ink-p { fill: var(--p-edge); }
.fill-t { fill: var(--t-fill); stroke: var(--t-edge); }
.edge-t { stroke: var(--t-edge); }
.ink-t { fill: var(--t-edge); }
.fill-b { fill: var(--b-fill); stroke: var(--b-edge); }
.edge-b { stroke: var(--b-edge); }
.ink-b { fill: var(--b-edge); }
.fill-d { fill: var(--d-fill); stroke: var(--d-edge); }
.edge-d { stroke: var(--d-edge); }
.ink-d { fill: var(--d-edge); }
.fill-x { fill: var(--x-fill); stroke: var(--x-edge); }
.edge-x { stroke: var(--x-edge); }
.ink-x { fill: var(--x-edge); }
</style>
<rect x="0" y="0" width="1200" height="933.5" class="ground" />
<text x="32" y="44.0" font-size="21" class="bold">The kernel contract, section by section</text>
<text x="32" y="64.0" font-size="12" class="dim">kernel-contract.md §1 to §8. KernelProblem is the only object that crosses into a backend: eleven fields, frozen, validated, versioned. On the left, what builds each</text>
<text x="32" y="79.5" font-size="12" class="dim">section; on the right, what a backend does with it.</text>
<text x="32" y="113.0" font-size="12" class="bold dim">built by</text>
<text x="386.0" y="113.0" font-size="12" class="bold ink-t">translate.problem.KernelProblem</text>
<text x="864.0" y="113.0" font-size="12" class="bold dim">read by a backend</text>
