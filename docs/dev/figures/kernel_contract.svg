<rect x="32" y="651.0" width="1136" height="250.5" rx="7" ry="7" class="plain" />
<text x="42.0" y="673.0" font-size="15" class="bold">Φ (§3) and the prefactor (§5) each take one of four representations, and device_ready is a predicate over the pair</text>
<rect x="42.0" y="686.0" width="553.0" height="66.5" rx="7" ry="7" class="fill-t" />
<text x="52.0" y="707.5" font-size="13" class="bold ink-t">"constant"</text>
<text x="52.0" y="723.0" font-size="12" class="dim">phi_constant · prefactor_constant</text>
<text x="52.0" y="738.5" font-size="12" class="dim">one term, and the distance as its weight</text>
<rect x="605.0" y="686.0" width="553.0" height="66.5" rx="7" ry="7" class="fill-t" />
<text x="615.0" y="707.5" font-size="13" class="bold ink-t">"expansion"</text>
<text x="615.0" y="723.0" font-size="12" class="dim">ParameterExpansion: terms, weights</text>
<text x="615.0" y="738.5" font-size="12" class="dim">n_terms of them, over the mode set's scalar paths</text>
<rect x="42.0" y="762.5" width="553.0" height="66.5" rx="7" ry="7" class="planned" />
<text x="52.0" y="784.0" font-size="13" class="bold dim">"table"</text>
<text x="52.0" y="799.5" font-size="12" class="dim">phi_coefficients · prefactor</text>
<text x="52.0" y="815.0" font-size="12" class="dim">a Clenshaw pass over the state's size × the degree</text>
<rect x="605.0" y="762.5" width="553.0" height="66.5" rx="7" ry="7" class="fill-t" />
<text x="615.0" y="784.0" font-size="13" class="bold ink-t">"separable"</text>
<text x="615.0" y="799.5" font-size="12" class="dim">SeparableOperator: material and transverse vectors</text>
<text x="615.0" y="815.0" font-size="12" class="dim">corrected split-square subtraction; no coefficient volume</text>
<text x="42.0" y="856.5" font-size="12" class="dim">device_ready is exactly "neither of them is the z table". translate.stage splits a stage in two: terms, the fixed arrays uploaded once, and scalars, a small record of</text>
<text x="42.0" y="872.0" font-size="12" class="dim">host floats per stage. A backend evaluates ΔΦ = stage.combine(weights, terms), or evaluates the separable vectors without a full coefficient volume;</text>
<text x="42.0" y="887.5" font-size="12" class="dim">translate.stage.require_device_ready is the refusal device backends raise. Numba CPU also accepts z tables through its host adapter.</text>
</svg>