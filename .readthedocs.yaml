# Read the Docs: the manual, built from the locked environment with uv, exactly as
# `poe docs` builds it (warnings are errors). The worked examples' output is committed
# (docs/auto_examples/), so nothing long runs here; the tutorials execute as in every
# normal build. The native package is not installed: the manual needs no compiled code.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    # solprop's version comes from the repository's tags (hatch-vcs).
    post_checkout:
      - git fetch --unshallow --tags || true
    create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    install:
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --frozen
    # Some builds stall in the tutorials and are killed at Read the Docs' time limit,
    # which discards their output. A stalled attempt is stopped after 720 s with
    # SIGABRT, so faulthandler writes every thread's stack to the log, and is run once
    # more: sphinx-gallery keeps the tutorials that finished, so the second attempt
    # executes only the rest. A failed build (warnings are errors) is not retried.
    build:
      html:
        - |
          for attempt in 1 2; do
            PYTHONFAULTHANDLER=1 timeout -s ABRT 720 "$READTHEDOCS_VIRTUALENV_PATH/bin/python" -m sphinx -b html -W -n --keep-going docs "$READTHEDOCS_OUTPUT/html" && exit 0
            status=$?
            [ "$status" -eq 124 ] || exit "$status"
            echo "sphinx-build stalled past 720 s (attempt $attempt); the stacks above show where"
          done
          exit 124
