# Read the Docs: the manual, built from the locked environment with uv, exactly as
# `poe docs` builds it (warnings are errors). The worked examples' output is committed
# (docs/auto_examples/), so nothing long runs here; the tutorials execute as in every
# normal build. The native package is not installed: the manual needs no compiled code.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    # solprop's version comes from the repository's tags (hatch-vcs).
    post_checkout:
      - git fetch --unshallow --tags || true
    create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    install:
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --frozen
    # Read the Docs stops a build at its time limit (about 1500 s, set-up included) and
    # discards its log. Since 2026-10-29 some builds have run into it, though the same
    # tools build in about 600 s otherwise. So Sphinx runs in a session of its own with
    # its log in a file, and the command always ends first: at 1200 s Sphinx writes
    # every thread's stack to the log (SOLPROP_DOCS_WATCHDOG, docs/conf.py); at 1260 s
    # the process table is printed with each process's state and kernel wait, the
    # session is killed and the log printed. A failed or stalled build is not retried.
    build:
      html:
        - |
          echo "builder: $(nproc) CPUs; $(free -m | awk '/^Mem:/ {print $2 " MB, " $7 " MB available"}')"
          log=/tmp/sphinx-build.log
          SOLPROP_DOCS_WATCHDOG=1200 setsid "$READTHEDOCS_VIRTUALENV_PATH/bin/python" -m sphinx -b html -W -n --keep-going docs "$READTHEDOCS_OUTPUT/html" > "$log" 2>&1 &
          pid=$!
          deadline=$((SECONDS + 1260))
          while kill -0 "$pid" 2>/dev/null && [ "$SECONDS" -lt "$deadline" ]; do sleep 5; done
          if kill -0 "$pid" 2>/dev/null; then
            echo "sphinx-build still running after $SECONDS s; load $(cut -d' ' -f1-3 /proc/loadavg)"
            free -m
            ps -eo pid,ppid,pgid,stat,etime,time,wchan:24,args --sort=pid
            kill -KILL -- "-$pid" 2>/dev/null
            cat "$log"
            echo "sphinx-build stopped after $SECONDS s; the stacks and the process table above show where"
            exit 124
          fi
          wait "$pid"
          status=$?
          cat "$log"
          exit "$status"
