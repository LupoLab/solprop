[build-system]
requires = ["nanobind>=2.9", "scikit-build-core>=0.11", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "solprop-cpunative"
dynamic = ["version"]
description = "Experimental CPU-only OpenMP and FFTW backend for solprop"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["numpy>=2.3"]

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["src/solprop_cpunative"]

[tool.setuptools_scm]
root = ".."
fallback_version = "0.0.0"

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PERF", "PT", "RUF", "UP", "W"]
ignore = ["F722"] # jaxtyping shape strings are not Python expressions.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = ["-ra", "--strict-markers"]
filterwarnings = ["error"]
