<text x="330.0" y="154.0" font-size="11" class="dim">A_eff = 1.497 a²  (the GNLSE's</text>
<text x="330.0" y="168.0" font-size="11" class="dim">surrogate profile)</text>
<circle cx="279.0" cy="210.0" r="2.2" class="node-dim" />
<path d="M279.0,210.0 L325.0,202.0" class="leader" />
