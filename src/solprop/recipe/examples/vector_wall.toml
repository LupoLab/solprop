# Ten fixed steps of a 50 um helium bore under the vector wall, launched into HE11 with
# HE12, EH11 and EH12 retained: the script's first run.
# mirrors: docs/tutorials/capillaries/plot_09_vector_wall.py

[recipe]
format = 1
route = "capillary"
title = "The vector wall's hybrid conversion"

[build]
radius = "50 um"
length = "0.2 mm"
gas = "He"
pressure = "1 bar"
wavelength = "800 nm"
grid = { type = "FieldGrid.from_limits", length = "0.2 mm", reference_wavelength = "800 nm", wavelength_limits = ["400 nm", "1600 nm"], trange = "300 fs" }
absorber = { type = "absorber", boundary_length = 1e3 }  # the reference length, m
fwhm = "30 fs"
energy = "0.001 uJ"
# The order nu = 1: HE11, HE12, then EH11 and EH12 (a negative n is the EH family).
modes = [
    { type = "MarcatiliMode", radius = "50 um", n = 1, m = 1 },
    { type = "MarcatiliMode", radius = "50 um", n = 1, m = 2 },
    { type = "MarcatiliMode", radius = "50 um", n = -1, m = 1 },
    { type = "MarcatiliMode", radius = "50 um", n = -1, m = 2 },
]
n_save = 11
backend = "numpy_ref"
wall = { type = "CoherentWall", impedance = "te_tm" }
schedule = { type = "FixedSchedule", steps = [2e-05, 2e-05, 2e-05, 2e-05, 2e-05, 2e-05, 2e-05, 2e-05, 2e-05, 2e-05] }
dz_max = "0.02 mm"
dz_init = "0.02 mm"
plasma = false
raman = false
noise = "none"
