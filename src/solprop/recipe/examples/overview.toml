# Two centimetres of a helium-filled capillary, the package overview's first run.
# mirrors: docs/tutorials/basics/plot_01_package_overview.py

[recipe]
format = 1
route = "capillary"
title = "A short helium capillary"

[build]
radius = "125 um"
length = "0.02 m"
gas = "He"
pressure = "1 bar"
wavelength = "800 nm"
wavelength_limits = ["200 nm", "2000 nm"]
trange = "150 fs"
fwhm = "10 fs"
energy = "20 uJ"
n_save = 5
seed = 20261027
