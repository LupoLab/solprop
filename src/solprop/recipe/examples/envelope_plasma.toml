# Four fixed steps of a thin argon slab with photoionisation, carrier resolved: the
# first of the script's two grids.
# mirrors: docs/tutorials/capillaries/plot_05_envelope_plasma.py
# Unseeded, as the script is: each run draws its own input noise. The script passes
# optmat's argon rate at 800 nm as an object; plasma = true builds the same rate.

[recipe]
format = 1
route = "capillary"
title = "Photoionisation in a thin argon slab"

[build]
radius = "125 um"
length = "8e-6 m"
gas = "Ar"
pressure = "1 bar"
grid = { type = "FieldGrid.from_limits", length = "8e-6 m", reference_wavelength = "800 nm", wavelength_limits = ["500 nm", "1200 nm"], trange = "320 fs", ffac = 16 }
envelope = false
wavelength = "800 nm"
fwhm = "60 fs"
energy = "1000 uJ"
mode_average = true
cladding = 1.45
loss = false
kerr = false
plasma = true
backend = "numpy_ref"
rtol = 1e-6
atol = 1e-14
save_planes = ["2e-6 m", "4e-6 m", "6e-6 m", "8e-6 m"]
dz_init = "2e-6 m"
dz_max = "2e-6 m"
schedule = { type = "FixedSchedule.uniform", z_start = "0 m", z_end = "8e-6 m", dz = "2e-6 m" }
ionisation_field_range = [1e7, 1e11]
absorber = { type = "absorber", boundary_length = 1e-3 }  # the reference length, m
stats = { type = "StatsSpec", names = ["energy", "species_ionisation", "peak_ionisation_rate"] }
