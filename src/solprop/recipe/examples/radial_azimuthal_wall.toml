# A 15 fs, 300 uJ pulse through a metre of helium-filled bore, launched azimuthally
# polarised into TE01 with TE02 and TE03 retained, under the vector wall: the script's
# first run.
# mirrors: docs/examples/waveguides/plot_03_vector_wall.py

[recipe]
format = 1
route = "capillary"
title = "Azimuthal polarisation under the vector wall"

[build]
radius = "100 um"
length = "1 m"
gas = "He"
pressure = "3 bar"
wavelength = "800 nm"
wavelength_limits = ["90 nm", "3000 nm"]
trange = "400 fs"
fwhm = "15 fs"
energy = "300 uJ"
# Supplied modes take the route's fill: only their geometry is written.
modes = [
    { type = "MarcatiliMode", radius = "100 um", kind = "TE", n = 0, m = 1 },
    { type = "MarcatiliMode", radius = "100 um", kind = "TE", n = 0, m = 2 },
    { type = "MarcatiliMode", radius = "100 um", kind = "TE", n = 0, m = 3 },
]
wall = { type = "CoherentWall", impedance = "te_tm" }
dz_max = "2 mm"
n_save = 101
# A TE0m field vanishes on the axis, where the rate table's range is otherwise read.
ionisation_field_range = [1e8, 5e11]  # V/m
seed = 20261027
